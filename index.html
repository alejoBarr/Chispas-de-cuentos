<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/vite.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chispas de Cuentos: Cuentacuentos con IA</title>
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Metaetiquetas para compartir en redes sociales (WhatsApp, etc.) -->
    <meta property="og:title" content="Chispas de Cuentos ✨" />
    <meta property="og:description" content="¡Crea y descubre cuentos mágicos para niños con Inteligencia Artificial! 🤖📖" />
    <meta property="og:image" content="/vite.svg" />
    <meta property="og:type" content="website" />
    
    <meta name="theme-color" content="#a855f7" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Nunito', sans-serif;
      }
    </style>
  </head>
  <body class="bg-purple-50">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
